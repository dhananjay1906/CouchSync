<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CouchSync</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
  <!-- Start screen -->
  <section id="start" class="view">
    <div class="brand"><span class="logo">🛋️</span><h1>CouchSync</h1></div>
    <p class="muted">Watch in sync with up to 4 friends, with live video and chat.</p>
    <label>Your name <input id="name" maxlength="24" placeholder="e.g. DJ" autocomplete="off"></label>
    <button id="create" class="primary">Start a party in this tab</button>
    <div class="or">or join one</div>
    <div class="row">
      <input id="join-code" placeholder="Paste invite link or code" autocomplete="off">
      <button id="join">Join</button>
    </div>
    <p id="start-error" class="error hidden"></p>
    <details class="settings-mini">
      <summary>Server</summary>
      <label>Server address <input id="server-url" placeholder="https://your-server.example.com"></label>
      <button id="test-server" class="small">Test connection</button>
      <span id="server-status" class="muted small-text"></span>
    </details>
  </section>

  <!-- Party screen -->
  <section id="party" class="view hidden">
    <header class="bar">
      <div class="conn"><span id="conn-dot" class="dot"></span><span id="room-label"></span></div>
      <div class="bar-actions">
        <button id="copy-link" class="small" title="Copy invite link">🔗 Invite</button>
        <button id="open-settings" class="icon" title="Settings">⚙️</button>
        <button id="collapse" class="icon embed-only" title="Hide the panel — friends' faces float over the video">⇥</button>
      </div>
    </header>

    <div id="banner" class="banner hidden"><span id="banner-text"></span><button id="banner-action" class="small hidden"></button></div>

    <div id="mini-bar" class="mini-bar">
      <button id="mini-expand" class="ctl" title="Show the full panel (chat, settings)">⇤</button>
      <button id="mini-mic" class="ctl" title="Mute / unmute">🎙️</button>
      <button id="mini-cam" class="ctl" title="Camera on / off">📷</button>
      <button id="mini-hide" class="ctl" title="Hide faces (the call keeps going)">✕</button>
    </div>
    <div id="grid" class="grid"><button id="show-hidden" class="small hidden"></button></div>
    <button id="float-placeholder" class="float-placeholder hidden">⧉ Faces are floating over the movie — click to bring them back</button>

    <button id="enable-sound" class="primary sound-btn hidden">🔊 Click to hear your friends</button>
    <div class="media-controls">
      <button id="toggle-mic" class="ctl" title="Mute / unmute">🎙️</button>
      <button id="toggle-cam" class="ctl" title="Camera on / off">📷</button>
      <button id="float" class="ctl" title="Float friends' faces over the movie (stays on top in fullscreen)">⧉</button>
      <button id="sync-me" class="ctl wide" title="Move everyone to where you are">⇆ Sync all to me</button>
    </div>

    <div id="sync-status" class="sync-status"></div>

    <div id="chat" class="chat" aria-live="polite"></div>
    <div class="reactions">
      <button data-r="😂">😂</button><button data-r="😮">😮</button><button data-r="😭">😭</button><button data-r="❤️">❤️</button><button data-r="🔥">🔥</button><button data-r="👏">👏</button>
    </div>
    <form id="chat-form" class="chat-form" autocomplete="off">
      <input id="chat-input" maxlength="500" placeholder="Say something…">
      <button type="submit" class="primary">Send</button>
    </form>
  </section>

  <!-- Settings drawer -->
  <section id="settings" class="drawer hidden">
    <header class="bar"><strong>Settings</strong><button id="close-settings" class="icon">✕</button></header>
    <label>Your name <input id="set-name" maxlength="24"></label>
    <label class="check"><input type="checkbox" id="set-follow"> Auto-open the host's video when they switch</label>
    <label class="check"><input type="checkbox" id="set-duck"> Lower movie volume while friends talk</label>
    <label class="check host-only-setting"><input type="checkbox" id="set-hostonly"> Only I (host) can play / pause / seek</label>
    <label class="check host-only-setting"><input type="checkbox" id="set-lock"> Lock party (no new people can join)</label>
    <label class="check"><input type="checkbox" id="set-hideip"> Hide my IP address from friends (video goes through the relay; needs a relay server)</label>
    <div id="members" class="members"></div>
    <button id="rebind" class="small not-embed">Use the current tab for the party</button>
    <button id="cam-permission" class="small">Fix camera / mic permission</button>
    <button id="copy-debug" class="small">Copy debug info (for troubleshooting)</button>
    <button id="leave" class="danger">Leave party</button>
  </section>

  <template id="tile-tpl">
    <div class="tile">
      <video playsinline autoplay></video>
      <div class="avatar"></div>
      <div class="label"><span class="nm"></span><span class="icons"></span></div>
      <button class="tile-hide" title="Hide this person's video (you still hear them)">✕</button>
    </div>
  </template>

  <script type="module" src="panel.js"></script>
</body>
</html>
